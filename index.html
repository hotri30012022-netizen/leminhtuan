<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GPS AR.js - 100m Radius</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial;
    }

    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 999;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      border-radius: 10px;
      min-width: 220px;
    }
  </style>
</head>

<body>

<div id="info">
  Đang tìm GPS...
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true;"
  arjs="
    sourceType: webcam;
    videoTexture: true;
    debugUIEnabled: false;
  "
>

  <a-assets>
    <a-asset-item
      id="bird-obj"
      src="./assets/10012_crab_v2_iterations-1.obj">
    </a-asset-item>

    <a-asset-item
      id="bird-mtl"
      src="./assets/10012_crab_v2_iterations-1.mtl">
    </a-asset-item>
  </a-assets>

  <!-- Camera GPS -->
  <a-camera
    gps-new-camera="gpsMinDistance: 5"
    rotation-reader>
  </a-camera>

  <!-- Object GPS -->
  <a-entity
    id="bird-place"
    visible="false"
    gps-new-entity-place="
      latitude: 10.421500;
      longitude: 105.643072;
    "
  >

    <a-obj-model
      src="#bird-obj"
      mtl="#bird-mtl"
      scale="0.5 0.5 0.5"
      rotation="-90 0 0">
    </a-obj-model>

  </a-entity>

</a-scene>

<script>

const TARGET_LAT = 10.421500;
const TARGET_LON = 105.643072;

const MAX_DISTANCE = 100; // mét

const info = document.getElementById("info");
const bird = document.getElementById("bird-place");


// Tính khoảng cách GPS bằng Haversine
function calculateDistance(lat1, lon1, lat2, lon2) {

  const R = 6371000;

  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

  return R * c;
}


// Theo dõi GPS
navigator.geolocation.watchPosition(

  (position) => {

    const userLat = position.coords.latitude;
    const userLon = position.coords.longitude;

    const accuracy = position.coords.accuracy;

    const distance = calculateDistance(
      userLat,
      userLon,
      TARGET_LAT,
      TARGET_LON
    );

    // Nếu trong bán kính 100m
    if (distance <= MAX_DISTANCE) {

      bird.setAttribute("visible", true);

      info.innerHTML = `
        ✅ Đã kích hoạt AR<br>
        Khoảng cách: ${distance.toFixed(1)} m<br>
        Sai số GPS: ${accuracy.toFixed(1)} m
      `;

    } else {

      bird.setAttribute("visible", false);

      info.innerHTML = `
        📍 Hãy tiến gần mục tiêu hơn<br>
        Khoảng cách: ${distance.toFixed(1)} m<br>
        Cần <= ${MAX_DISTANCE} m
      `;
    }

  },

  (error) => {

    info.innerHTML = "Không truy cập được GPS";

    console.error(error);
  },

  {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 27000
  }

);

</script>

</body>
</html>
