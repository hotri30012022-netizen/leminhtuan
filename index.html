<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GPS AR.js</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 999;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      border-radius: 10px;
      font-family: Arial;
    }
  </style>
</head>

<body>

<div id="info">Đang tìm GPS...</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true;"
  arjs="
    sourceType: webcam;
    videoTexture: true;
    debugUIEnabled: false;
  "
>

  <a-assets>
    <a-asset-item
      id="bird-obj"
      src="./assets/10012_crab_v2_iterations-1.obj">
    </a-asset-item>

    <a-asset-item
      id="bird-mtl"
      src="./assets/10012_crab_v2_iterations-1.mtl">
    </a-asset-item>
  </a-assets>

  <!-- Camera GPS -->
  <a-camera
    gps-new-camera="gpsMinDistance: 5"
    rotation-reader>
  </a-camera>

  <!-- Object GPS -->
  <a-entity
    gps-new-entity-place="
      latitude: 10.421500;
      longitude: 105.643072;
    "
  >

    <a-obj-model
      src="#bird-obj"
      mtl="#bird-mtl"
      scale="0.5 0.5 0.5"
      rotation="-90 0 0">
    </a-obj-model>

  </a-entity>

</a-scene>

<script>
  const info = document.getElementById("info");

  navigator.geolocation.watchPosition(

    (position) => {

      info.innerHTML = `
        Lat: ${position.coords.latitude.toFixed(6)}<br>
        Lon: ${position.coords.longitude.toFixed(6)}<br>
        Accuracy: ${position.coords.accuracy.toFixed(1)} m
      `;

    },

    (err) => {
      info.innerHTML = "Không truy cập được GPS";
      console.error(err);
    },

    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 27000
    }

  );
</script>

</body>
</html>
